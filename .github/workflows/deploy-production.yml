# 正式部署。`environment: production` 讓 GitHub 擋在人工核准前面。
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false      # 正式部署不要互相取消

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production      # ← 需要人工核准

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # wrangler 對「token 字串無效」與「token 有效但權限不足」都回
      # Invalid access token [code: 9109]，光看日誌分不出來。先用 Cloudflare 的
      # 驗證端點把兩者分開，省去猜測。
      - name: 檢查 API token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          if [ -z "${TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN 未設定"; exit 1; fi

          # 貼上時被截斷或夾帶換行是最常見的原因
          len=${#TOKEN}
          stripped=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ "$len" -ne "${#stripped}" ]; then
            echo "::error::token 含空白或換行 —— 重設時用 printf '%s' '<token>' | gh secret set CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ "$len" -lt 30 ]; then
            echo "::error::token 只有 ${len} 個字元，看起來被截斷了"
            exit 1
          fi

          status=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" != "200" ]; then
            echo "::error::token 本身無效（驗證端點回 HTTP ${status}）。請重新產生並更新 secret。"
            sed 's/"[a-zA-Z0-9_-]\{20,\}"/"***"/g' /tmp/verify.json
            exit 1
          fi

          # token 字串沒問題，再確認它讀得到這個帳號的 D1
          status=$(curl -s -o /tmp/acct.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/d1/database")
          if [ "$status" != "200" ]; then
            echo "::error::token 有效，但存取帳號 ${ACCOUNT} 的 D1 失敗（HTTP ${status}）。"
            echo "::error::權限要含 Workers Scripts→Edit、D1→Edit、Account Settings→Read，且 Account Resources 要包含這個帳號。"
            sed 's/"[a-zA-Z0-9_-]\{20,\}"/"***"/g' /tmp/acct.json
            exit 1
          fi
          echo "✅ token 有效且讀得到帳號的 D1"


      # migration 一定在 build 與 deploy 之前。兩者之間有幾秒鐘，所以
      # **每個 migration 都必須與當下已部署的 Worker 向後相容**。
      - name: 套用正式的 migration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply gleanstudio --remote --env production --config wrangler.jsonc

      # ⚠️ 環境在 build 時用 CLOUDFLARE_ENV 決定，部署時**不要**加 --env。
      #    理由見 deploy-preview.yml 的同一段註解與 docs/07-deployment.md §2
      - name: build（綁 production）
        env:
          CLOUDFLARE_ENV: production
        run: npm run build

      - name: 確認綁定正確
        run: node scripts/check-deploy-config.mjs --expect production

      - name: 部署
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci

      # parity 打**已部署的**網址，不是本機。這是唯一能證明線上輸出仍與
      # 舊站一致的檢查。見 docs/08-verification.md §6
      - name: parity 打線上
        run: npm run parity -- --base ${{ vars.PRODUCTION_URL || 'https://gleanstudio.com.tw' }}
