# 每個 PR 與 push 都跑。**parity 的 Level B 是 gating** —— 前台掉一個 class 就擋。
#
# CI 能跑 parity 的前提是資料進得了版控：內容匯出（data/export/*.json）在庫裡，
# 帳號資料不在。管理者帳號由 bootstrap-admin.mjs 現場建，密碼是隨機的。
# 見 docs/07-deployment.md §2
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 這個 repo 是 public，任何 commit 都對全世界公開。
  # 舊系統的明碼憑證躺在 reference/（已被 .gitignore 排除），這一關確保它們
  # 不會因為某次 git add -f、.gitignore 被改、或有人把值抄進文件而外洩。
  #
  # ⚠️ 檢查規則**刻意不寫死任何實際憑證字串** —— 檢查指令本身若含祕密，
  #    就是另一次外洩。用形狀比對，不用值比對。
  guard:
    name: 機密防護
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 確認機密未進版控
        run: |
          set -uo pipefail
          fail=0

          if [ -n "$(git ls-files reference)" ]; then
            echo "::error::reference/ 下有檔案進入版控 —— 該目錄含舊系統明碼憑證，必須保持排除"
            git ls-files reference | head -20
            fail=1
          fi

          for f in .dev.vars .env data/export/Admins.json data/export/admin-hashes.json; do
            if [ -n "$(git ls-files "$f")" ]; then
              echo "::error::$f 不應進入版控"
              fail=1
            fi
          done

          # 帶值的密碼指派與連線字串。
          #
          # ⚠️ 兩件事：
          #   1. 一定要 -i —— 舊系統的設定檔把這些鍵名寫成大寫開頭，
          #      少了它這兩條規則等於不存在（用假的洩漏檔實測驗證過）。
          #   2. **註解裡不要寫出規則的實際範例** —— 會命中自己。
          #      這一段的前一版就是這樣把 CI 弄紅的。
          if git grep -nIEi "(password|pwd)=[^ ;\"'|)]{4,}" -- . ':!*.md'; then
            echo "::error::偵測到疑似密碼指派"
            fail=1
          fi
          if git grep -nIEi "(data source|server)=tcp:" -- . ; then
            echo "::error::偵測到疑似資料庫連線字串"
            fail=1
          fi
          # 服務供應商的 key 格式
          if git grep -nIE "SG\.[A-Za-z0-9_-]{16,}" -- . ; then
            echo "::error::偵測到疑似 SendGrid API key"
            fail=1
          fi

          [ $fail -eq 0 ] && echo "✅ 未發現機密外洩" || exit 1

  verify:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # sqlite3 給 verify-d1.mjs 讀本機 miniflare 的 sqlite 檔用
      - name: 安裝 sqlite3
        run: sudo apt-get install -y --no-install-recommends sqlite3

      - name: 建立本機 D1 並灌內容
        run: |
          npm run db:migrate
          node scripts/build-seed-sql.mjs --no-accounts
          npm run db:seed
          npm run seed:order
          npx wrangler d1 execute gleanstudio --local --file=db/seed/0002-order-backfill.sql

      # 順序資料能不能從 golden 重建 —— 重建結果要與版控裡的一致
      - name: 順序資料可重建
        run: |
          npm run order:derive
          git diff --exit-code data/export/legacy-order.json data/export/projects-order.json

      - name: 資料驗證
        run: node scripts/verify-d1.mjs --no-accounts

      - name: 權限註冊表
        run: npm run verify:permissions

      - name: build
        run: npm run build

      - name: 啟動 wrangler dev
        run: |
          npx wrangler dev --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8787/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8787/ || { cat /tmp/wrangler.log; exit 1; }

      # ── gating ──
      - name: parity（Level B）
        run: npm run parity

      - name: 聯絡表單 POST
        run: npm run parity:contact

      - name: 後台端到端
        env:
          SMOKE_USERNAME: ci
          # 只在這一個 job 裡存在，跑完就沒了
          SMOKE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-ci-smoke-pass
          # 標出每次外部 d1 寫入，才能跟 wrangler 的請求 log 對時間（§9 的不穩定）
          SMOKE_TRACE: '1'
        run: |
          ADMIN_PASSWORD="$SMOKE_PASSWORD" node scripts/bootstrap-admin.mjs \
            --username ci --name "CI 測試帳號" --no-force-change \
            --lims 3,4,5,6,8,9
          npm run smoke:admin

      - name: 失敗時附上 wrangler log
        if: failure()
        run: |
          echo "── wrangler dev 的 stdout ──"
          tail -60 /tmp/wrangler.log || true
          echo
          echo "── wrangler 自己的詳細 log（崩潰堆疊在這裡）──"
          for f in ~/.config/.wrangler/logs/*.log; do
            echo "▸ $f"
            tail -80 "$f" || true
          done
